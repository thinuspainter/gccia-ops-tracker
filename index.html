<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GCCIA Operations Audit — VTN Timeline (July 2026)</title>
<style>
:root{
  --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155; --txt:#e2e8f0; --dim:#94a3b8;
  --vtn:#38bdf8; --mkt:#a78bfa; --cp:#34d399; --op:#fbbf24; --ice:#f87171; --meet:#f472b6; --int:#64748b; --arr:#2dd4bf;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font:14px/1.5 "Segoe UI",system-ui,sans-serif;padding:20px}
h1{font-size:20px;margin-bottom:2px}
.sub{color:var(--dim);font-size:12px;margin-bottom:14px}
.layout{display:grid;grid-template-columns:1fr 330px;gap:16px;align-items:start}
@media(max-width:1100px){.layout{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
/* Frozen top plane: title, meta line and the whole day picker stay pinned while the tables scroll.
   Negative margins cancel the body padding so the bar spans the full width. */
.topfreeze{position:sticky;top:0;z-index:60;background:var(--bg);
  padding:20px 20px 6px;margin:-20px -20px 12px;border-bottom:1px solid var(--line);
  box-shadow:0 8px 20px -6px rgba(0,0,0,.55)}
.topfreeze h1{margin-top:0}
.topfreeze .card{margin-bottom:8px}
.dp-pop{z-index:70}
.card h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin-bottom:10px}
.days{display:flex;flex-wrap:wrap;gap:6px}
.day{padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;font-size:12px;user-select:none;text-align:center;min-width:56px}
.day small{display:block;color:var(--dim);font-size:10px}
.day.active{background:#0ea5e9;border-color:#0ea5e9;color:#fff}
.day.active small,.day.active .cnt{color:#e0f2fe}
.day.disabled{opacity:.35;cursor:not-allowed;border-style:dashed}
.day .cnt{font-size:9.5px;color:var(--dim)}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.pill{padding:4px 10px;border-radius:20px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;font-size:11px}
.pill.active{background:#334155;border-color:#94a3b8}
.tl-day{margin-bottom:22px}
.tl-day-h{font-size:15px;font-weight:600;padding-bottom:6px;border-bottom:1px solid var(--line);margin-bottom:10px;display:flex;justify-content:space-between;align-items:baseline}
.tl-day-h span{color:var(--dim);font-size:11px;font-weight:400}
.ev{display:grid;grid-template-columns:52px 14px 1fr;gap:10px;margin-bottom:2px}
.ev .t{color:var(--dim);font-size:12px;text-align:right;padding-top:10px;font-variant-numeric:tabular-nums}
.rail{position:relative}
.rail::before{content:"";position:absolute;left:6px;top:0;bottom:0;width:2px;background:var(--line)}
.dot{position:absolute;left:1px;top:14px;width:12px;height:12px;border-radius:50%;border:2px solid var(--bg)}
.box{background:var(--panel2);border:1px solid var(--line);border-left:4px solid var(--dim);border-radius:8px;padding:8px 12px;margin-bottom:8px;cursor:pointer}
.box .hd{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.box .ti{font-weight:600;font-size:13px}
.box .mw{font-size:12px;color:var(--dim);white-space:nowrap}
.box .meta{font-size:11px;color:var(--dim);margin-top:2px}
.box .det{display:none;margin-top:8px;font-size:12px;color:#cbd5e1;border-top:1px dashed var(--line);padding-top:8px}
.box.open .det{display:block}
.box .src{font-size:10px;color:#64748b;margin-top:6px}
.fl{margin-top:6px}
.fl span{display:inline-block;background:rgba(239,68,68,.15);color:#fca5a5;border:1px solid rgba(239,68,68,.4);font-size:11px;border-radius:6px;padding:2px 8px;margin:2px 4px 0 0}
.obs li{margin:0 0 10px 16px;font-size:12.5px;color:#cbd5e1}
.btb table{width:100%;border-collapse:collapse;font-size:11.5px;font-variant-numeric:tabular-nums}
.btb th,.btb td{padding:3px 6px;text-align:right;border-bottom:1px solid var(--line)}
.btb th{color:var(--dim);font-weight:500}
.btb td:first-child,.btb th:first-child{text-align:left}
.slider-out{display:flex;justify-content:space-between;font-size:12px;margin-top:8px}
.slider-out b{font-size:16px;color:#7dd3fc}
input[type=range]{width:100%;margin-top:10px;accent-color:#0ea5e9}
.note{font-size:11px;color:var(--dim);margin-top:8px}
.empty{color:var(--dim);font-size:13px;padding:30px;text-align:center}
.ntct{width:100%;border-collapse:collapse;font-size:11px;font-variant-numeric:tabular-nums;margin-top:8px}
.ntct th,.ntct td{padding:3px 6px;text-align:right;border-bottom:1px solid var(--line)}
.ntct th{color:var(--dim)}
.ntct td.neg{color:#fca5a5;font-weight:600}
.ntct td.pos{color:#86efac}
.ntc-day-h{font-size:13px;font-weight:600;margin:14px 0 4px}
.ntc-day-h span{color:var(--dim);font-weight:400;font-size:11px}
.tabs{display:flex;gap:6px;margin:6px 0 8px}
.tab{padding:4px 12px;border-radius:6px 6px 0 0;border:1px solid var(--line);border-bottom:none;background:var(--panel2);cursor:pointer;font-size:11.5px;color:var(--dim)}
.tab.active{background:#334155;color:var(--txt);border-color:#94a3b8}
.tab.disabled{opacity:.4;cursor:not-allowed}
.vgrid{width:100%;border-collapse:collapse;font-size:10px;margin:6px 0 4px;font-variant-numeric:tabular-nums}
.vgrid th,.vgrid td{border:1px solid #2c3a52;padding:1px 3px;text-align:center;color:var(--dim)}
.vgrid td.lbl{text-align:left;white-space:nowrap;color:var(--txt);font-size:10.5px}
.vgrid td.on{color:#0f172a;font-weight:600}
.vgrid tr.inf td.lbl{font-style:italic;color:#94a3b8}
.vgrid tr.oth td{opacity:.72}
.vgrid tr.oth td.lbl:first-child{border-left:3px solid #fb923c}
.vgrid tr.oth td.on{background-image:repeating-linear-gradient(45deg,rgba(0,0,0,.22) 0 3px,transparent 3px 6px)}
.vgrid th.dphd:hover{background:#334155;color:#e2e8f0}
.vgrid th.dpsel{background:#0ea5e9;color:#fff}
.wfpanel{margin:12px 0 4px}
.wfhd{font-size:12.5px;font-weight:600;color:#7dd3fc;margin-bottom:6px}
.wft{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
.wft td{padding:3px 8px;border-bottom:1px solid #263248}
.wft .wfno{color:#cbd5e1}
.wft .wfmw{text-align:right;color:#94a3b8;width:70px}
.wft .wfrun{text-align:right;font-weight:700;width:70px}
.wft .wfnote{color:#64748b;font-size:11px}
.wft tr.wfroute td{padding-top:8px;color:#e2e8f0;font-weight:600;border-bottom:none}
.wft tr.wfsub td{color:#94a3b8;font-style:italic;border-bottom:1px solid #3a4a63}
.wft tr.wfsub td:nth-child(3){text-align:right;font-style:normal;font-weight:600;color:#cbd5e1}
.wft tr.wftot td{font-weight:700;border-top:2px solid #64748b;border-bottom:none;padding-top:5px}
.wft tr.wftot td:nth-child(3){text-align:right}
.wft tr.wfbad td{color:#fca5a5;font-weight:600}
.wft tr.wfbad td:nth-child(3),.wft tr.wfok td:nth-child(3){text-align:right}
.wft tr.wfok td{color:#86efac}
.wft tr.wfoth td{color:#94a3b8;font-size:11.5px}
.wft tr.wfoth td:nth-child(3){text-align:right;font-style:italic}
.wft .sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:middle}
.wft tr.wftot td:nth-child(2){text-align:right;color:#94a3b8}
.wft td:nth-child(2){text-align:right}
/* ---- multi-select calendar date picker ---- */
.dpwrap{position:relative;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.dp-trig{display:flex;align-items:center;gap:9px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:9px 12px;color:var(--txt);font:inherit;font-size:13px;cursor:pointer;min-width:300px;text-align:left}
.dp-trig:hover,.dp-trig.on{border-color:#2dd4bf}
.dp-trig .cal{color:#2dd4bf;font-size:14px}
.dp-trig .caret{margin-left:auto;color:var(--dim)}
.dp-pop{display:none;position:absolute;top:calc(100% + 6px);left:0;z-index:60;background:#0b1220;border:1px solid #475569;border-radius:10px;box-shadow:0 14px 44px rgba(0,0,0,.65);width:440px;max-width:94vw}
.dp-pop.open{display:grid;grid-template-columns:1fr 76px}
.dp-months{max-height:370px;overflow-y:auto;padding:10px 12px}
.dp-rail{border-left:1px solid var(--line);max-height:370px;overflow-y:auto;padding:10px 6px;display:flex;flex-direction:column;gap:3px}
.dp-rb{font-size:11px;color:var(--dim);text-align:center;padding:6px 4px;border-radius:6px;cursor:pointer}
.dp-rb:hover{background:#1e293b;color:var(--txt)}
.dp-rb.cur{background:#134e4a;color:#ccfbf1}
.dp-mo{margin-bottom:14px}
.dp-mo-h{text-align:center;font-size:13px;font-weight:600;margin-bottom:7px}
.dp-dow,.dp-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.dp-dow span{text-align:center;font-size:10px;color:var(--dim);padding-bottom:2px}
.dp-d{position:relative;text-align:center;font-size:12px;padding:6px 0 9px;border-radius:6px;background:#1e293b;cursor:pointer;user-select:none;line-height:1.1}
.dp-d.pad{background:none;cursor:default}
.dp-d.we{color:#fca5a5}
.dp-d.off{opacity:.26;cursor:not-allowed;background:none}
.dp-d:not(.off):not(.pad):hover{background:#334155}
.dp-d.sel{background:#0d9488;color:#fff;font-weight:600}
.dp-d.sel.we{color:#fff}
.dp-d i{position:absolute;left:0;right:0;bottom:1px;font-style:normal;font-size:7.5px;color:var(--dim)}
.dp-d.sel i{color:#ccfbf1}
.dp-q{display:flex;gap:6px;flex-wrap:wrap}
.dp-q button{background:var(--panel2);border:1px solid var(--line);color:var(--dim);border-radius:20px;padding:5px 11px;font:inherit;font-size:11px;cursor:pointer}
.dp-q button:hover{border-color:#94a3b8;color:var(--txt)}
.dp-hint{position:sticky;bottom:-10px;background:#0b1220;font-size:10.5px;color:#64748b;padding:6px 0 2px;border-top:1px solid var(--line);margin-top:-8px}
/* ---- per-day horizontal tabs ---- */
.dtwrap{display:flex;align-items:flex-end;gap:6px;margin:10px 0 12px;border-bottom:1px solid var(--line)}
.dtarrow{flex:0 0 auto;background:var(--panel2);border:1px solid var(--line);color:var(--dim);border-radius:6px;width:26px;height:38px;margin-bottom:3px;cursor:pointer;font-size:15px;line-height:1}
.dtarrow:hover:not(:disabled){color:var(--txt);border-color:#94a3b8}
.dtarrow:disabled{opacity:.28;cursor:not-allowed}
.daytabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:thin;flex:1 1 auto;padding-bottom:2px;scroll-behavior:smooth}
.daytabs::-webkit-scrollbar{height:6px}
.daytabs::-webkit-scrollbar-thumb{background:#334155;border-radius:3px}
.dtab{flex:0 0 auto;padding:5px 13px 6px;border:1px solid var(--line);border-bottom:none;border-radius:7px 7px 0 0;background:var(--panel2);cursor:pointer;font-size:12px;color:var(--dim);text-align:center;white-space:nowrap}
.dtab b{display:block;font-size:12.5px;color:var(--txt);font-weight:600}
.dtab small{font-size:9.5px}
.dtab.active{background:#0e7490;border-color:#0e7490}
.dtab.active b,.dtab.active small{color:#fff}
/* ---- member-state position selector ---- */
.posbar{margin:2px 0 10px}
.posrow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:5px}
.poslbl{font-size:10.5px;color:var(--dim);width:62px;flex:0 0 62px;text-transform:uppercase;letter-spacing:.06em}
.poschip{background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:7px;
  padding:4px 10px;font:inherit;font-size:11.5px;cursor:pointer;display:inline-flex;align-items:baseline;gap:7px}
.poschip b{font-size:12.5px;font-variant-numeric:tabular-nums}
.poschip b.z{color:#64748b;font-weight:400}
.poschip i{font-style:normal;font-size:10px;color:#fca5a5;margin-left:-3px}
.poschip.gap{border-color:#b45309}
.poschip.gap.on i{color:#fecaca}
.poschip.on b.z{color:#a5f3fc}
.poschip:hover{border-color:#94a3b8}
.poschip.imp{border-left:3px solid #38bdf8}
.poschip.exp{border-left:3px solid #34d399}
.poschip.idle{color:var(--dim);border-left:3px solid #475569}
.poschip.on{background:#0e7490;border-color:#22d3ee;color:#fff}
.poschip.on b{color:#fff}
.vgrid tr.dim td{opacity:.34}
.vgrid td.ms{font-size:10px;color:var(--dim)}
.vgrid td.ms.mson{color:#7dd3fc;font-weight:600}
.dpnav{background:#1e293b;border:1px solid #475569;color:#7dd3fc;border-radius:5px;width:26px;height:22px;cursor:pointer;font-size:11px;line-height:1}
.dpnav:hover:not(:disabled){background:#334155}
.dpnav:disabled{opacity:.3;cursor:not-allowed}
.wfhd{display:flex;align-items:center;gap:8px}
.wfhd .dpttl{flex:1 1 auto}
.wfhd .dphint{font-size:10px;color:#64748b;font-weight:400}
#tip{position:fixed;display:none;z-index:50;background:#0b1220;border:1px solid #475569;border-radius:8px;padding:10px 12px;font-size:11.5px;max-width:320px;box-shadow:0 8px 24px rgba(0,0,0,.5);pointer-events:none}
#tip h4{font-size:12px;margin-bottom:6px;color:#7dd3fc}
#tip table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
#tip td{padding:1px 6px;text-align:right}
#tip td:first-child{text-align:left;color:#94a3b8}
#tip .tot td{border-top:1px solid #475569;font-weight:600}
#tip .neg{color:#fca5a5}#tip .pos{color:#86efac}
</style>
</head>

<style>

#lockForm{background:#18232f;border:1px solid #2b3a4a;border-radius:12px;padding:30px 32px;width:min(92vw,380px);
  box-shadow:0 18px 50px rgba(0,0,0,.5);text-align:center}

#lockForm .lk-s{color:#7f94a8;font-size:12.5px;margin-top:3px}
#lockForm .lk-p{color:#9fb3c8;font-size:13px;line-height:1.5;margin:16px 0 14px}
#lockPw{width:100%;box-sizing:border-box;padding:11px 13px;border-radius:8px;border:1px solid #33465a;
  background:#0f1821;color:#e8eef5;font-size:14px;outline:none}
#lockPw:focus{border-color:#4d90c9}
#lockGo{width:100%;margin-top:11px;padding:11px;border:0;border-radius:8px;background:#2f6fa8;color:#fff;

#lockGo:hover{background:#3a82c2}
#lockGo[disabled]{opacity:.6;cursor:default}
#lockForm .lk-e{color:#e8836f;font-size:12.5px;min-height:17px;margin-top:11px}
</style>
